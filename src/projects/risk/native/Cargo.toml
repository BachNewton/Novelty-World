[package]
name = "risk-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "risk_native"
path = "src/lib.rs"

[[bin]]
name = "risk-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
