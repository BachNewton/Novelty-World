# Voices to calibrate the casting score against the owner's ears. They aren't for any
# story: they span ages, pitches and accents, and some descriptions are expected to
# come out poor, since a score can't find a line it has only seen one side of.
text: >
  I walked down to the harbour this morning, before anyone else was awake. The boats
  were still tied up, the water was perfectly flat, and somebody had left a thermos on
  the wall. I stood there for a while, thinking about what she said, and then I went
  home.
