  - id: l119
    speaker: narrator
    text: "She finishes them. She hangs up the towel. Then she sits down at the table, between Nora's orange moon on the refrigerator and the box in the hall, and she opens the laptop, and goes to the website of the Finnish Immigration Service, which offers its pages in English."
